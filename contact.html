<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Inquiries - heyselcuk</title>
    <meta name="description" content="Business contact for paid partnerships and collaborations with Heyselcuk.">
    <link rel="icon" type="image/png" sizes="48x48" href="/android-chrome-48x48.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .contact-content {
            width: 100%;
            max-width: 640px;
        }

        .contact-title {
            margin-bottom: 28px;
            font-family: 'Orbitron', monospace;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 900;
            color: var(--primary-neon);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .contact-content p {
            margin-bottom: 20px;
            font-size: 1.2rem;
            line-height: 1.5;
        }

        .contact-email {
            margin: 32px 0;
            padding: 20px;
            border: 1px solid rgba(0, 255, 255, 0.45);
            background: rgba(0, 255, 255, 0.08);
            color: var(--text-white);
            font-family: 'Orbitron', monospace;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            font-weight: 700;
            letter-spacing: 1px;
            overflow-wrap: anywhere;
        }

        .contact-details {
            text-align: left;
            margin: 28px auto 0;
            max-width: 460px;
        }

        .contact-details li {
            margin-bottom: 10px;
            font-size: 1.05rem;
        }

        .contact-back {
            display: inline-block;
            margin-top: 40px;
            color: var(--primary-neon);
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .contact-back:hover,
        .contact-back:focus-visible {
            color: var(--text-white);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="contact-page">
        <section class="contact-content" aria-labelledby="contact-title">
            <h1 id="contact-title" class="contact-title">Business Inquiries</h1>
            <p>For paid partnerships and brand collaborations, please contact:</p>
            <p class="contact-email">businessheyselcuk@gmail.com</p>
            <p>Please include the following details:</p>
            <ul class="contact-details">
                <li>Company name and website</li>
                <li>Campaign brief and deliverables</li>
                <li>Budget and timeline</li>
            </ul>
            <a class="contact-back" href="index.html">Back to main page</a>
        </section>
    </main>
</body>
</html>
